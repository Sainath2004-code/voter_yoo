version: '3.8'

services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  # Microservices
  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./shared:/app/shared

  voter_service:
    build:
      context: .
      dockerfile: services/voter_service/Dockerfile
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./shared:/app/shared

  election_service:
    build:
      context: .
      dockerfile: services/election_service/Dockerfile
    env_file: .env
    volumes:
      - ./shared:/app/shared

  workflow_service:
    build:
      context: .
      dockerfile: services/workflow_service/Dockerfile
    env_file: .env
    volumes:
      - ./shared:/app/shared

  biometric_service:
    build:
      context: .
      dockerfile: services/biometric_service/Dockerfile
    env_file: .env
    volumes:
      - ./shared:/app/shared

  audit_service:
    build:
      context: .
      dockerfile: services/audit_service/Dockerfile
    env_file: .env
    volumes:
      - ./shared:/app/shared

  analytics_service:
    build:
      context: .
      dockerfile: services/analytics_service/Dockerfile
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./shared:/app/shared

  # Celery Workers
  worker_voter:
    build:
      context: .
      dockerfile: services/voter_service/Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./shared:/app/shared

  worker_notifications:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./shared:/app/shared

  # Frontend
  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"
    env_file: .env
