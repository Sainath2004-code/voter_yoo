global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8000']
    metrics_path: '/metrics'

  - job_name: 'voter-service'
    static_configs:
      - targets: ['voter-service:8000']
    metrics_path: '/metrics'

  - job_name: 'ai-worker-service'
    static_configs:
      - targets: ['ai-worker-service:8000']
    metrics_path: '/metrics'

  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'
